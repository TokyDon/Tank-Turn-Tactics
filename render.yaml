services:
  - type: web
    name: tank-turn-tactics
    env: node
    region: oregon
    plan: free
    buildCommand: >
      npm install --prefix server &&
      npm install --prefix client &&
      npm run build --prefix client
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true

    disk:
      name: game-data
      mountPath: /data
      sizeGB: 1
