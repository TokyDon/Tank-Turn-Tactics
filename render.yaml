services:
  - type: web
    name: tank-turn-tactics
    env: node
    region: oregon
    plan: free
    buildCommand: >
      npm install --prefix server &&
      npm install --prefix client &&
      npm run build --prefix client
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
