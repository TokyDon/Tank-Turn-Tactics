services:
  - type: web
    name: tank-turn-tactics
    env: node
    region: oregon
    plan: free
    buildCommand: >
      npm install --prefix server &&
      npm install --include=dev --prefix client &&
      npm run build --prefix client
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
